name: Python CI with Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Bajamos el código del repo
    - name: Checkout del código
      uses: actions/checkout@v3

    # 2. Construir la imagen Docker usando el Dockerfile
    - name: Construir Imagen Docker
      run: docker build -t calculadora-app .

    # 3. Correr el contenedor y ejecutar los tests adentro
    - name: Ejecutar Tests dentro del Contenedor
      run: docker run --rm calculadora-app
